name: RSS Bot - Test Server

on: workflow_dispatch

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restore state from cache
      uses: actions/cache/restore@v4
      with:
        path: posted_items.json
        key: rss-bot-state-test-${{ github.run_id }}
        restore-keys: |
          rss-bot-state-test-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run RSS bot with test webhook
      env:
        RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEST }}
      run: python rss_bot.py

    - name: Save state to cache
      uses: actions/cache/save@v4
      if: always()
      with:
        path: posted_items.json
        key: rss-bot-state-test-${{ github.run_id }}
